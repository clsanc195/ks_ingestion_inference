[project]
name = "kgi"
version = "0.1.0"
description = "Multi-modal knowledge graph ingestion with HITL-gated inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "instructor>=1.3",
    "anthropic>=0.40",
    "neo4j>=5.20",
    "qdrant-client>=1.9",
    "typer>=0.12",
    "rich>=13",
    "lxml>=5.2",
]

[project.optional-dependencies]
parsers = ["docling>=2.0"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
kgi = "kgi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
